[package]
name = "bevy_app_compute"
version = "0.17.0"
authors = [
    "Cornchip <cornchipgonecodin@gmail.com>",
    "Kjolnyr <kjolnyr@protonmail.com>",
]
edition = "2024"
description = "An easy way to run compute shaders for Bevy"
repository = "https://github.com/Kjolnyr/bevy_app_compute"
homepage = "https://github.com/Kjolnyr/bevy_app_compute"
documentation = "https://docs.rs/bevy_app_compute"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["game-development"]

[features]
shader_format_spirv = ["wgpu/spirv"]
# Kept for compatibility; Bevy 0.20 always supports WESL.
shader_format_wesl = []
webgl = []

[lib]
doctest = false

[dependencies]
bytemuck = ">=1.25"
# Must match the wgpu version used by Bevy.
wgpu = "30"

[dependencies.bevy]
version = "0.20"
default-features = false
# See https://github.com/bevyengine/bevy/blob/main/docs/cargo_features.md
features = [
  "bevy_render"
]

[dev-dependencies]
rand = ">=0.9.1"

[dev-dependencies.bevy]
version = "0.20"
default-features = false
features = [
  "bevy_animation",
  "bevy_log",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_gltf",
  "bevy_render",
  "bevy_sprite_render",
  "bevy_ui",
  "multi_threaded",
  "png",
  "x11",
  "bevy_winit",
  "bevy_window",
]

[[example]]
name = "simple"

[[example]]
name = "multi_pass"

[[example]]
name = "one_shot"

[[example]]
name = "boids"
